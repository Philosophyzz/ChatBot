[pytest]
# 测试从项目根目录运行；``src`` 由 tests/conftest.py 注入 sys.path，
# 因此这里不需要 pythonpath 配置（兼容不支持该选项的旧 pytest）。
testpaths = tests
addopts = -q --no-header -p no:cacheprovider
filterwarnings =
    # 第三方库内部的弃用警告，与本项目代码无关，且无法通过改我们的代码消除：
    #   - starlette 建议 testclient 改用 httpx2，而应用本身依赖 httpx
    #   - starlette 内部仍引用 anyio.abc.BlockingPortal 旧别名
    # 保留其他 warning，避免把真正的问题一起静音。
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*
    ignore:.*StarletteDeprecationWarning.*
